services:
  api:
    build:
      context: ../../api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 8080
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
